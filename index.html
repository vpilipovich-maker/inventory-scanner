
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Інвентаризація — V10</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 14px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f6f8;
  color: #222;
}

h2 { margin: 10px 0 5px; }
p { color: #555; }

button {
  background: #1769aa;
  color: white;
  border: 0;
  border-radius: 10px;
  padding: 13px 17px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
}

button:disabled { opacity: .5; }
.secondary { background: #666; }

.camera-box {
  position: relative;
  max-width: 550px;
  margin: 12px auto;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
}

video {
  display: block;
  width: 100%;
  height: auto;
}

.scan-area {
  position: absolute;
  left: 20%;
  top: 42%;
  width: 60%;
  height: 16%;
  border: 2px solid #00ff88;
  border-radius: 8px;
  pointer-events: none;
}

.scan-line {
  position: absolute;
  left: 23%;
  top: 50%;
  width: 54%;
  border-top: 2px solid #00ff88;
  pointer-events: none;
}

#result {
  max-width: 550px;
  margin: 12px auto;
  padding: 15px;
  border-radius: 10px;
  background: #e5e7eb;
  font-size: 17px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

#cameraInfo, #details {
  max-width: 550px;
  margin: 8px auto;
  font-size: 13px;
  color: #555;
}

.manual {
  max-width: 550px;
  margin: 15px auto;
}

.manual input {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  border: 1px solid #aaa;
  border-radius: 9px;
}
</style>
</head>

<body>

<h2>Інвентаризація обладнання</h2>
<p>Code 128 — швидкий сканер V10</p>

<button id="startButton" onclick="startScanner()">
  Почати сканування
</button>

<button class="secondary" onclick="stopScanner()">
  Зупинити
</button>

<div class="camera-box">
  <video id="camera" autoplay playsinline muted></video>
  <div class="scan-area"></div>
  <div class="scan-line"></div>
</div>

<div id="result">Очікування сканування...</div>
<div id="cameraInfo"></div>
<div id="details"></div>

<div class="manual">
  <input id="manualCode"
         type="text"
         placeholder="Інвентарний номер вручну">
  <button onclick="sendManual()">Перевірити номер</button>
</div>

<script>
'use strict';

const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbxQSpqKkPO0AinEQ-N4f7tz12K6je2aFDbyLO3MMgyjpbci8edMDq57qhos4VBJOTgE/exec';

const video = document.getElementById('camera');
const resultBox = document.getElementById('result');
const cameraInfo = document.getElementById('cameraInfo');
const details = document.getElementById('details');
const startButton = document.getElementById('startButton');

let stream = null;
let reader = null;
let detector = null;
let scanning = false;
let sending = false;
let startToken = 0;
let scanTimer = null;
let frameNumber = 0;
let lastNativeSuccess = 0;

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', {
  willReadFrequently: true
});

function showResult(message, color = '#e5e7eb') {
  resultBox.textContent = message;
  resultBox.style.background = color;
}

function validCode(code) {
  return typeof code === 'string' &&
    code.trim().length > 0 &&
    code.trim().length <= 150;
}

function showPreviousResult() {
  const p = new URLSearchParams(location.search);
  const status = p.get('status');
  const code = p.get('barcode');
  const row = p.get('row');

  if (!status) return;

  if (status === 'found') {
    showResult(
      'Знайдено: ' + code + '. Позначено зеленим.',
      '#b7e1cd'
    );
  } else if (status === 'added') {
    showResult(
      'Новий номер додано: ' + code,
      '#fff3cd'
    );
  } else if (status === 'cancelled') {
    showResult('Додавання скасовано');
  }

  if (row) {
    details.textContent = 'Рядок таблиці: ' + row;
  }

  history.replaceState(
    {},
    '',
    location.pathname + '?v=10'
  );
}

async function openCamera() {
  const modes = [
    {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1920 },
      height: { ideal: 1080 }
    },
    {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    {
      facingMode: { ideal: 'environment' }
    },
    true
  ];

  let lastError;

  for (let i = 0; i < modes.length; i++) {
    try {
      details.textContent =
        'Запуск камери: режим ' + (i + 1);

      return await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: modes[i]
      });
    } catch (error) {
      lastError = error;

      if (error.name === 'NotAllowedError' ||
          error.name === 'SecurityError') {
        throw error;
      }
    }
  }

  throw lastError ||
    new Error('Камера недоступна');
}

async function configureCamera(track) {
  try {
    const caps = track.getCapabilities
      ? track.getCapabilities()
      : {};

    if (caps.focusMode?.includes('continuous')) {
      try {
        await track.applyConstraints({
          advanced: [{ focusMode: 'continuous' }]
        });
      } catch (e) {}
    }

    if (caps.zoom &&
        Number.isFinite(caps.zoom.min) &&
        Number.isFinite(caps.zoom.max)) {
      const zoom = Math.max(
        caps.zoom.min,
        Math.min(1, caps.zoom.max)
      );

      try {
        await track.applyConstraints({
          advanced: [{ zoom }]
        });
      } catch (e) {}
    }

    const s = track.getSettings();

    cameraInfo.textContent =
      'Відео: ' + (s.width || video.videoWidth) +
      '×' + (s.height || video.videoHeight) +
      ' | Zoom: ' + (s.zoom ?? 'авто') +
      ' | Фокус: ' + (s.focusMode || 'авто');

  } catch (e) {
    cameraInfo.textContent =
      'Стандартні налаштування камери';
  }
}

async function setupDecoders() {
  detector = null;
  reader = null;

  if ('BarcodeDetector' in window) {
    try {
      const formats =
        await BarcodeDetector.getSupportedFormats();

      if (formats.includes('code_128')) {
        detector = new BarcodeDetector({
          formats: ['code_128']
        });
      }
    } catch (e) {
      detector = null;
    }
  }

  if (window.ZXing) {
    const hints = new Map();

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [ZXing.BarcodeFormat.CODE_128]
    );

    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      true
    );

    reader = new ZXing.MultiFormatReader();
    reader.setHints(hints);
  }

  if (!detector && !reader) {
    throw new Error(
      'Не вдалося завантажити механізм розпізнавання'
    );
  }

  details.textContent =
    detector
      ? 'Режим: швидкий BarcodeDetector + ZXing'
      : 'Режим: ZXing';
}

async function startScanner() {
  if (scanning || sending) return;

  if (!navigator.mediaDevices?.getUserMedia) {
    showResult('Камера недоступна', '#f4cccc');
    return;
  }

  const token = ++startToken;

  scanning = true;
  startButton.disabled = true;

  try {
    showResult('Запускаємо камеру...');

    const opened = await openCamera();

    if (!scanning || token !== startToken) {
      opened.getTracks().forEach(t => t.stop());
      return;
    }

    stream = opened;
    video.srcObject = stream;
    await video.play();

    if (!scanning || token !== startToken) return;

    await configureCamera(stream.getVideoTracks()[0]);
    await setupDecoders();

    if (!scanning || token !== startToken) return;

    frameNumber = 0;
    lastNativeSuccess = 0;

    showResult('Наведіть штрихкод у зелену рамку');

    scheduleNextFrame(token, 0);

  } catch (error) {
    if (token !== startToken) return;

    stopScanner(false);

    showResult(
      'Помилка: ' + error.message,
      '#f4cccc'
    );
  }
}

function scheduleNextFrame(token, delay = 70) {
  if (!scanning || token !== startToken) return;

  scanTimer = setTimeout(() => {
    scanFrame(token);
  }, delay);
}

function drawScanRegion() {
  const w = video.videoWidth;
  const h = video.videoHeight;

  if (!w || !h) return false;

  // Відео може бути портретним.
  // Беремо центральну область без обрізання
  // горизонтальних країв штрихкоду.
  const sx = Math.floor(w * 0.05);
  const sy = Math.floor(h * 0.30);
  const sw = Math.floor(w * 0.90);
  const sh = Math.floor(h * 0.40);

  // Обмежуємо кількість пікселів,
  // але зберігаємо пропорції.
  const scale = Math.min(1, 1280 / sw);

  canvas.width = Math.max(1, Math.round(sw * scale));
  canvas.height = Math.max(1, Math.round(sh * scale));

  ctx.drawImage(
    video,
    sx, sy, sw, sh,
    0, 0, canvas.width, canvas.height
  );

  return true;
}

function decodeZXing() {
  if (!reader) return '';

  try {
    const source =
      new ZXing.HTMLCanvasElementLuminanceSource(
        canvas
      );

    const bitmap = new ZXing.BinaryBitmap(
      new ZXing.HybridBinarizer(source)
    );

    const result = reader.decode(bitmap);

    return result
      ? String(result.getText()).trim()
      : '';

  } catch (e) {
    return '';
  } finally {
    reader.reset();
  }
}

function enhanceContrast() {
  const image = ctx.getImageData(
    0, 0, canvas.width, canvas.height
  );

  const data = image.data;
  let min = 255;
  let max = 0;

  for (let i = 0; i < data.length; i += 4) {
    const gray =
      0.299 * data[i] +
      0.587 * data[i + 1] +
      0.114 * data[i + 2];

    if (gray < min) min = gray;
    if (gray > max) max = gray;
  }

  const range = Math.max(1, max - min);

  for (let i = 0; i < data.length; i += 4) {
    const gray =
      0.299 * data[i] +
      0.587 * data[i + 1] +
      0.114 * data[i + 2];

    let value = ((gray - min) / range) * 255;
    value = (value - 127.5) * 1.5 + 127.5;
    value = Math.max(0, Math.min(255, value));

    data[i] = data[i + 1] = data[i + 2] = value;
  }

  ctx.putImageData(image, 0, 0);
}

async function scanFrame(token) {
  if (!scanning ||
      sending ||
      token !== startToken ||
      video.readyState < 2) {
    return;
  }

  try {
    frameNumber++;

    if (!drawScanRegion()) {
      return;
    }

    let code = '';

    // Спочатку нативне швидке розпізнавання.
    if (detector) {
      try {
        const results = await detector.detect(canvas);

        if (!scanning || token !== startToken) return;

        const found = results.find(
          r => r.format === 'code_128'
        );

        if (found) {
          code = String(found.rawValue || '').trim();
          lastNativeSuccess = Date.now();
        }
      } catch (e) {
        // Якщо нативний механізм дав помилку,
        // продовжуємо через ZXing.
      }
    }

    // ZXing — резервне розпізнавання.
    if (!code && reader) {
      code = decodeZXing();
    }

    // Для вицвілих штрихкодів періодично
    // посилюємо контрастність.
    if (!code && reader && frameNumber % 8 === 0) {
      enhanceContrast();
      code = decodeZXing();
    }

    if (validCode(code)) {
      sendBarcode(code);
      return;
    }

  } catch (error) {
    console.warn('Помилка сканування:', error);
  } finally {
    if (scanning && token === startToken) {
      scheduleNextFrame(token, 50);
    }
  }
}

function sendBarcode(code) {
  code = String(code || '').trim();

  if (!validCode(code) || sending) return;

  sending = true;
  stopScanner(false);

  if (navigator.vibrate) {
    navigator.vibrate(100);
  }

  showResult(
    'Зчитано: ' + code + '. Перевіряємо...',
    '#fff3cd'
  );

  const url = SCRIPT_URL +
    '?action=scan&barcode=' +
    encodeURIComponent(code);

  window.location.assign(url);
}

function sendManual() {
  const code = document
    .getElementById('manualCode')
    .value.trim();

  if (!validCode(code)) {
    showResult(
      'Введіть коректний номер',
      '#f4cccc'
    );
    return;
  }

  sendBarcode(code);
}

function stopScanner(showMessage = true) {
  scanning = false;
  startToken++;

  if (scanTimer) {
    clearTimeout(scanTimer);
    scanTimer = null;
  }

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  video.srcObject = null;
  reader = null;
  detector = null;
  startButton.disabled = false;

  if (showMessage) {
    sending = false;
    showResult('Сканування зупинено');
  }
}

window.addEventListener('pagehide', () => {
  stopScanner(false);
});

showPreviousResult();
</script>
</body>
</html>
