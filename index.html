
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Сканер інвентаризації</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
    }

    button {
      padding: 15px 20px;
      font-size: 18px;
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }

    video {
      width: 100%;
      max-width: 500px;
      margin-top: 15px;
      background: black;
      border-radius: 10px;
    }

    #result {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <h2>Інвентаризація обладнання</h2>
  <p>Автоматичне сканування штрихкодів — тест</p>

  <button id="startButton" onclick="startScanner()">
    Почати сканування
  </button>

  <video id="camera" autoplay playsinline muted></video>

  <div id="result">Очікування сканування...</div>

  <script>
    const SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbxQSpqKkPO0AinEQ-N4f7tz12K6je2aFDbyLO3MMgyjpbci8edMDq57qhos4VBJOTgE/exec';

    const TEST_BARCODE = '11137000039';

    let reader = null;
    let sending = false;

    async function startScanner() {
      const resultBox = document.getElementById('result');

      try {
        if (!window.ZXing) {
          throw new Error(
            'Бібліотека ZXing не завантажилася'
          );
        }

        if (reader) {
          reader.reset();
        }

        reader = new ZXing.BrowserMultiFormatReader();
        sending = false;

        resultBox.textContent =
          'Наведіть камеру на штрихкод';

        await reader.decodeFromVideoDevice(
          undefined,
          'camera',
          (result, error) => {
            if (!result || sending) return;

            const code = result.getText().trim();

            if (code !== TEST_BARCODE) {
              resultBox.textContent =
                'Тест: очікується номер ' + TEST_BARCODE;
              return;
            }

            sending = true;

            resultBox.textContent =
              'Зчитано: ' + code +
              '. Передавання в таблицю...';

            if (navigator.vibrate) {
              navigator.vibrate(150);
            }

            reader.reset();

            const target =
              SCRIPT_URL +
              '?action=scan&barcode=' +
              encodeURIComponent(code);

            window.location.assign(target);
          }
        );

      } catch (error) {
        resultBox.textContent =
          'Помилка: ' +
          error.name + ' — ' + error.message;
      }
    }
  </script>

</body>
</html>
