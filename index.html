
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Сканер інвентаризації</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 15px;
    }
    button {
      padding: 15px 20px;
      font-size: 18px;
      background: #1769aa;
      color: white;
      border: 0;
      border-radius: 10px;
    }
    video {
      width: 100%;
      max-width: 500px;
      margin-top: 15px;
      background: black;
      border-radius: 10px;
    }
    #result {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h2>Інвентаризація обладнання</h2>
  <p>Сканування штрихкодів — тест</p>
<button onclick="testConnection()">
  Перевірити зв’язок
</button>
  
<button onclick="testRedirect()">
  ТЕСТ ПЕРЕДАВАННЯ
</button>

<script>
function testRedirect() {
  const url = prompt(
    'Встав адресу Google Apps Script до /exec'
  );

  if (!url) return;

  window.location.href =
    url + '?action=scan&barcode=11137000039';
}
</script>

  <button onclick="startScanner()">
    Почати сканування
  </button>

  <video id="camera" autoplay playsinline muted></video>

  <div id="result">Очікування сканування...</div>

  <script>
    let reader = null;
    let lastCode = '';

async function testConnection() {
  const url = prompt(
    'Встав URL Google Apps Script, що закінчується на /exec'
  );

  if (!url) return;

  const resultBox = document.getElementById('result');
  resultBox.textContent = 'Перевіряємо зв’язок...';

  try {
    const response = await fetch(
      url + '?action=scan&barcode=11137000039'
    );

    const data = await response.json();

    resultBox.textContent =
      'Відповідь сервера: ' + JSON.stringify(data);
  } catch (error) {
    resultBox.textContent =
      'Помилка з’єднання: ' + error.message;
  }
}

    async function startScanner() {
      const resultBox = document.getElementById('result');

      try {
        if (!window.ZXing) {
          throw new Error('Бібліотека ZXing не завантажилася');
        }

        if (reader) reader.reset();

        reader = new ZXing.BrowserMultiFormatReader();

        resultBox.textContent = 'Наведіть камеру на штрихкод';

        await reader.decodeFromVideoDevice(
          undefined,
          'camera',
          (result, error) => {
            if (result) {
              const code = result.getText().trim();

              if (code !== lastCode) {
                lastCode = code;
                resultBox.textContent = 'Зчитано: ' + code;
                if (navigator.vibrate) navigator.vibrate(150);
              }
            }
          }
        );
      } catch (error) {
        resultBox.textContent =
          'Помилка: ' + error.name + ' — ' + error.message;
      }
    }
  </script>
</body>
</html>
