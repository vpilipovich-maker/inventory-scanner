
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Інвентаризація V11.1</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:12px;
  font-family:Arial,sans-serif;
  text-align:center;
  background:#f5f6f8;
  color:#222;
}

h2{margin:10px 0 5px}
p{color:#555}

button{
  border:0;
  border-radius:10px;
  padding:13px 17px;
  margin:5px;
  font-size:16px;
  color:white;
  background:#1769aa;
  cursor:pointer;
}

button:disabled{opacity:.5}
.secondary{background:#666}

.camera-box{
  position:relative;
  max-width:550px;
  margin:12px auto;
  background:#000;
  border-radius:12px;
  overflow:hidden;
}

video{
  display:block;
  width:100%;
  height:auto;
}

.scan-area{
  position:absolute;
  left:12%;
  top:40%;
  width:76%;
  height:20%;
  border:2px solid #00ff88;
  border-radius:8px;
  pointer-events:none;
}

.scan-line{
  position:absolute;
  left:15%;
  top:50%;
  width:70%;
  border-top:2px solid #00ff88;
  pointer-events:none;
}

.hint{
  max-width:550px;
  margin:10px auto;
  padding:10px;
  border-radius:9px;
  background:#e8f2ff;
  color:#17578c;
  font-size:15px;
}

#result{
  max-width:550px;
  margin:12px auto;
  padding:15px;
  border-radius:10px;
  background:#e5e7eb;
  font-size:17px;
  font-weight:bold;
  overflow-wrap:anywhere;
}

#cameraInfo,#details{
  max-width:550px;
  margin:8px auto;
  font-size:13px;
  color:#555;
}

.manual{
  max-width:550px;
  margin:15px auto;
}

.manual input{
  width:100%;
  padding:12px;
  font-size:18px;
  border:1px solid #aaa;
  border-radius:9px;
}
</style>
</head>

<body>

<h2>Інвентаризація обладнання</h2>
<p>Code 128 — сканер V11.1</p>

<div class="hint">
  Тримайте камеру на відстані 10–20 см.
  Найкращий результат — приблизно 15 см.
</div>

<button id="startButton" onclick="startScanner()">
  Почати сканування
</button>

<button class="secondary" onclick="stopScanner()">
  Зупинити
</button>

<div class="camera-box">
  <video id="camera" autoplay playsinline muted></video>
  <div class="scan-area"></div>
  <div class="scan-line"></div>
</div>

<div id="result">Очікування сканування...</div>
<div id="cameraInfo"></div>
<div id="details"></div>

<div class="manual">
  <input id="manualCode"
         type="text"
         placeholder="Інвентарний номер вручну">
  <button onclick="sendManual()">
    Перевірити номер
  </button>
</div>

<script>
'use strict';

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbxQSpqKkPO0AinEQ-N4f7tz12K6je2aFDbyLO3MMgyjpbci8edMDq57qhos4VBJOTgE/exec';

const video=document.getElementById('camera');
const resultBox=document.getElementById('result');
const cameraInfo=document.getElementById('cameraInfo');
const details=document.getElementById('details');
const startButton=document.getElementById('startButton');

let stream=null;
let detector=null;
let reader=null;
let scanning=false;
let sending=false;
let token=0;
let timer=null;
let startedAt=0;
let frameCount=0;

let candidate='';
let candidateCount=0;
let candidateTime=0;
let candidateFrame=-1;

let lastScanMode='';

const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d',{
  willReadFrequently:true
});

function showResult(text,color='#e5e7eb'){
  resultBox.textContent=text;
  resultBox.style.background=color;
}

function validCode(code){
  return typeof code==='string' &&
    code.trim().length>0 &&
    code.trim().length<=150;
}

function showPreviousResult(){
  const p=new URLSearchParams(location.search);
  const status=p.get('status');
  const code=p.get('barcode');
  const row=p.get('row');

  if(!status)return;

  if(status==='found'){
    showResult(
      'Знайдено: '+code+'. Позначено зеленим.',
      '#b7e1cd'
    );
  }else if(status==='added'){
    showResult('Додано: '+code,'#fff3cd');
  }else if(status==='cancelled'){
    showResult('Додавання скасовано');
  }

  if(row){
    details.textContent='Рядок таблиці: '+row;
  }

  history.replaceState(
    {},'',location.pathname+'?v=111'
  );
}

async function openCamera(){
  const modes=[
    {
      facingMode:{ideal:'environment'},
      width:{ideal:1920},
      height:{ideal:1080}
    },
    {
      facingMode:{ideal:'environment'},
      width:{ideal:1280},
      height:{ideal:720}
    },
    {facingMode:{ideal:'environment'}},
    true
  ];

  let lastError;

  for(let i=0;i<modes.length;i++){
    try{
      details.textContent=
        'Запуск камери: режим '+(i+1);

      return await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:modes[i]
      });
    }catch(e){
      lastError=e;

      if(e.name==='NotAllowedError' ||
         e.name==='SecurityError'){
        throw e;
      }
    }
  }

  throw lastError ||
    new Error('Камера недоступна');
}

async function configureCamera(track){
  try{
    const caps=track.getCapabilities
      ?track.getCapabilities():{};

    if(caps.focusMode?.includes('continuous')){
      try{
        await track.applyConstraints({
          advanced:[{focusMode:'continuous'}]
        });
      }catch(e){}
    }

    if(caps.zoom &&
       Number.isFinite(caps.zoom.min) &&
       Number.isFinite(caps.zoom.max)){
      const zoom=Math.max(
        caps.zoom.min,
        Math.min(1,caps.zoom.max)
      );

      try{
        await track.applyConstraints({
          advanced:[{zoom}]
        });
      }catch(e){}
    }

    const s=track.getSettings();

    cameraInfo.textContent=
      'Відео: '+(s.width||video.videoWidth)+
      '×'+(s.height||video.videoHeight)+
      ' | Zoom: '+(s.zoom??'авто')+
      ' | Фокус: '+(s.focusMode||'авто');
  }catch(e){
    cameraInfo.textContent=
      'Камера: стандартні параметри';
  }
}

async function setupDecoders(){
  detector=null;
  reader=null;

  if('BarcodeDetector' in window){
    try{
      const formats=
        await BarcodeDetector.getSupportedFormats();

      if(formats.includes('code_128')){
        detector=new BarcodeDetector({
          formats:['code_128']
        });
      }
    }catch(e){}
  }

  if(window.ZXing){
    const hints=new Map();

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [ZXing.BarcodeFormat.CODE_128]
    );

    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      false
    );

    reader=new ZXing.MultiFormatReader();
    reader.setHints(hints);
  }

  if(!detector&&!reader){
    throw new Error(
      'Механізм розпізнавання недоступний'
    );
  }
}

function drawRegion(mode){
  const w=video.videoWidth;
  const h=video.videoHeight;

  if(!w||!h)return false;

  let sx,sy,sw,sh;

  if(mode==='fast'){
    sx=Math.floor(w*.05);
    sy=Math.floor(h*.38);
    sw=Math.floor(w*.90);
    sh=Math.floor(h*.24);
  }else{
    sx=Math.floor(w*.02);
    sy=Math.floor(h*.25);
    sw=Math.floor(w*.96);
    sh=Math.floor(h*.50);
  }

  const maxWidth=mode==='fast'?1280:1600;
  const scale=Math.min(1,maxWidth/sw);

  canvas.width=Math.max(1,Math.round(sw*scale));
  canvas.height=Math.max(1,Math.round(sh*scale));

  ctx.drawImage(
    video,
    sx,sy,sw,sh,
    0,0,canvas.width,canvas.height
  );

  return true;
}

function decodeZXing(){
  if(!reader)return '';

  try{
    const source=
      new ZXing.HTMLCanvasElementLuminanceSource(
        canvas
      );

    const bitmap=new ZXing.BinaryBitmap(
      new ZXing.HybridBinarizer(source)
    );

    const result=reader.decode(bitmap);

    return result
      ?String(result.getText()).trim()
      :'';
  }catch(e){
    return '';
  }finally{
    reader.reset();
  }
}

function enhanceContrast(){
  const img=ctx.getImageData(
    0,0,canvas.width,canvas.height
  );

  const data=img.data;
  let min=255,max=0;

  for(let i=0;i<data.length;i+=4){
    const g=.299*data[i]+
      .587*data[i+1]+
      .114*data[i+2];

    min=Math.min(min,g);
    max=Math.max(max,g);
  }

  const range=Math.max(1,max-min);

  for(let i=0;i<data.length;i+=4){
    const g=.299*data[i]+
      .587*data[i+1]+
      .114*data[i+2];

    let v=((g-min)/range)*255;
    v=(v-127.5)*1.5+127.5;
    v=Math.max(0,Math.min(255,v));

    data[i]=data[i+1]=data[i+2]=v;
  }

  ctx.putImageData(img,0,0);
}

async function startScanner(){
  if(scanning||sending)return;

  if(!navigator.mediaDevices?.getUserMedia){
    showResult(
      'Камера недоступна',
      '#f4cccc'
    );
    return;
  }

  const current=++token;

  scanning=true;
  startButton.disabled=true;

  try{
    showResult('Запускаємо камеру...');

    const opened=await openCamera();

    if(!scanning||current!==token){
      opened.getTracks().forEach(t=>t.stop());
      return;
    }

    stream=opened;
    video.srcObject=stream;
    await video.play();

    if(!scanning||current!==token)return;

    await configureCamera(
      stream.getVideoTracks()[0]
    );

    await setupDecoders();

    if(!scanning||current!==token)return;

    startedAt=performance.now();
    frameCount=0;

    candidate='';
    candidateCount=0;
    candidateTime=0;
    candidateFrame=-1;

    showResult('Наведіть штрихкод у рамку');

    details.textContent=detector
      ?'Режим: BarcodeDetector + ZXing'
      :'Режим: ZXing';

    schedule(current,0);

  }catch(e){
    if(current!==token)return;

    stopScanner(false);

    showResult(
      'Помилка: '+e.message,
      '#f4cccc'
    );
  }
}

function schedule(current,delay=40){
  if(!scanning||current!==token)return;

  timer=setTimeout(()=>{
    scanFrame(current);
  },delay);
}

function registerCandidate(code,mode){
  const now=performance.now();

  if(candidate===code &&
     now-candidateTime<2000 &&
     candidateFrame!==frameCount){
    candidateCount++;
  }else{
    candidate=code;
    candidateCount=1;
  }

  candidateTime=now;
  candidateFrame=frameCount;

  if(candidateCount>=2){
    lastScanMode=mode;

    const seconds=(
      (now-startedAt)/1000
    ).toFixed(2);

    details.textContent=
      'Підтверджено за '+seconds+
      ' с | '+lastScanMode;

    sendBarcode(code);
  }else{
    showResult(
      'Зчитано: '+code+
      '. Перевіряємо повторно...',
      '#fff3cd'
    );
  }
}

async function scanFrame(current){
  if(!scanning||
     sending||
     current!==token||
     video.readyState<2){
    return;
  }

  try{
    frameCount++;

    const elapsed=performance.now()-startedAt;

    const mode=elapsed>2500 &&
      frameCount%3===0
      ?'wide':'fast';

    if(!drawRegion(mode))return;

    let code='';
    let scanMode='';

    if(detector){
      try{
        const found=await detector.detect(canvas);

        if(current!==token||!scanning)return;

        const item=found.find(
          x=>x.format==='code_128'
        );

        if(item){
          code=String(item.rawValue||'').trim();
          scanMode='BarcodeDetector';
        }
      }catch(e){}
    }

    const useZXing=
      !detector ||
      (elapsed>1200 && frameCount%3===0);

    if(!code&&reader&&useZXing){
      code=decodeZXing();
      if(code)scanMode='ZXing';
    }

    if(!code&&reader&&elapsed>2500 &&
       frameCount%10===0){
      drawRegion('wide');
      enhanceContrast();
      code=decodeZXing();

      if(code)scanMode='ZXing + контраст';
    }

    if(validCode(code)){
      registerCandidate(code,scanMode);
    }

  }catch(e){
    console.warn(e);
  }finally{
    if(scanning&&current===token){
      schedule(current,40);
    }
  }
}

function sendBarcode(code){
  code=String(code||'').trim();

  if(!validCode(code)||sending)return;

  sending=true;
  stopScanner(false);

  if(navigator.vibrate){
    navigator.vibrate(100);
  }

  showResult(
    'Підтверджено: '+code+'. Передаємо...',
    '#b7e1cd'
  );

  const url=SCRIPT_URL+
    '?action=scan&barcode='+
    encodeURIComponent(code);

  window.location.assign(url);
}

function sendManual(){
  const code=document
    .getElementById('manualCode')
    .value.trim();

  if(!validCode(code)){
    showResult(
      'Введіть коректний номер',
      '#f4cccc'
    );
    return;
  }

  sendBarcode(code);
}

function stopScanner(showMessage=true){
  scanning=false;
  token++;

  if(timer){
    clearTimeout(timer);
    timer=null;
  }

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }

  video.srcObject=null;
  detector=null;
  reader=null;
  startButton.disabled=false;

  if(showMessage){
    sending=false;
    showResult('Сканування зупинено');
  }
}

window.addEventListener('pagehide',()=>{
  stopScanner(false);
});

showPreviousResult();
</script>
</body>
</html>
