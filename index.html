
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Інвентаризація — V9</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  text-align: center;
  background: #f5f6f8;
  color: #222;
}

h2 { margin: 8px 0; }

p { color: #555; }

button {
  border: none;
  border-radius: 10px;
  padding: 13px 17px;
  margin: 5px;
  font-size: 16px;
  color: white;
  background: #1769aa;
  cursor: pointer;
}

button:disabled { opacity: 0.5; }

.secondary { background: #666; }
.success { background: #18834a; }
.danger { background: #b73a3a; }

.camera-box {
  position: relative;
  max-width: 550px;
  margin: 12px auto;
  background: black;
  border-radius: 12px;
  overflow: hidden;
}

video {
  display: block;
  width: 100%;
  height: auto;
}

.scan-area {
  position: absolute;
  left: 5%;
  top: 35%;
  width: 90%;
  height: 30%;
  border: 2px solid #00ff88;
  border-radius: 8px;
  pointer-events: none;
}

.scan-line {
  position: absolute;
  top: 50%;
  left: 8%;
  width: 84%;
  border-top: 2px solid #00ff88;
  pointer-events: none;
}

#result {
  max-width: 550px;
  margin: 12px auto;
  padding: 15px;
  border-radius: 10px;
  background: #e5e7eb;
  font-size: 17px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

#cameraInfo, #details {
  max-width: 550px;
  margin: 8px auto;
  font-size: 13px;
  color: #555;
  overflow-wrap: anywhere;
}

#confirmation {
  display: none;
  max-width: 550px;
  margin: 12px auto;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  background: white;
}

#confirmation input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  font-size: 19px;
  border: 1px solid #aaa;
  border-radius: 8px;
}

#requestFrame {
  display: none;
}
</style>
</head>

<body>

<h2>Інвентаризація обладнання</h2>
<p>Code 128 — сканер V9</p>

<button id="startButton" onclick="startScanner()">
  Почати сканування
</button>

<button class="secondary" onclick="stopScanner()">
  Зупинити
</button>

<div class="camera-box">
  <video id="camera"
         autoplay
         playsinline
         muted></video>

  <div class="scan-area"></div>
  <div class="scan-line"></div>
</div>

<div id="result">
  Натисніть «Почати сканування»
</div>

<div id="cameraInfo"></div>
<div id="details"></div>

<div id="confirmation">
  <h3 id="confirmTitle">Підтвердження номера</h3>
  <p id="confirmDescription"></p>

  <input id="barcodeInput"
         type="text"
         inputmode="text"
         autocomplete="off">

  <button id="confirmButton"
          class="success"
          onclick="confirmBarcode()">
    Підтвердити
  </button>

  <button class="secondary"
          onclick="cancelConfirmation()">
    Скасувати
  </button>
</div>

<button class="secondary"
        onclick="manualEntry()">
  Ввести номер вручну
</button>

<iframe id="requestFrame"
        title="Обмін із таблицею"></iframe>

<script>
'use strict';

const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbxQSpqKkPO0AinEQ-N4f7tz12K6je2aFDbyLO3MMgyjpbci8edMDq57qhos4VBJOTgE/exec';

const video = document.getElementById('camera');
const resultBox = document.getElementById('result');
const cameraInfo = document.getElementById('cameraInfo');
const details = document.getElementById('details');
const startButton = document.getElementById('startButton');
const confirmation = document.getElementById('confirmation');
const barcodeInput = document.getElementById('barcodeInput');
const confirmTitle = document.getElementById('confirmTitle');
const confirmDescription =
  document.getElementById('confirmDescription');
const confirmButton =
  document.getElementById('confirmButton');
const requestFrame =
  document.getElementById('requestFrame');

let stream = null;
let reader = null;
let scanning = false;
let processing = false;
let decoding = false;
let scanTimer = null;

let canvas = document.createElement('canvas');
let ctx = canvas.getContext('2d', {
  willReadFrequently: true
});

let frameNumber = 0;
let candidate = '';
let candidateCount = 0;
let candidateTime = 0;
let currentCode = '';
let confirmMode = '';
let pendingRequest = null;
let requestTimer = null;

function showResult(message, color = '#e5e7eb') {
  resultBox.textContent = message;
  resultBox.style.background = color;
}

function setDetails(message) {
  details.textContent = message;
}

function cleanCode(value) {
  return String(value || '').trim();
}

function validCode(code) {
  return code.length > 0 && code.length <= 150;
}

async function startScanner() {
  if (scanning || processing) return;

  if (!window.ZXing) {
    showResult(
      'Не завантажилась бібліотека ZXing',
      '#f4cccc'
    );
    return;
  }

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    showResult(
      'Браузер не підтримує доступ до камери',
      '#f4cccc'
    );
    return;
  }

  scanning = true;
  startButton.disabled = true;
  confirmation.style.display = 'none';

  try {
    showResult('Запускаємо камеру...');

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 2560 },
        height: { ideal: 1440 },
        frameRate: { ideal: 30 }
      }
    });

    if (!scanning) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      return;
    }

    video.srcObject = stream;
    await video.play();

    const track = stream.getVideoTracks()[0];
    await configureCamera(track);

    const hints = new Map();

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [ZXing.BarcodeFormat.CODE_128]
    );

    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      true
    );

    reader = new ZXing.MultiFormatReader();
    reader.setHints(hints);

    candidate = '';
    candidateCount = 0;
    candidateTime = 0;
    frameNumber = 0;

    showResult('Наведіть штрихкод у зелену рамку');
    setDetails('Режим: автоматичне сканування');

    scanTimer = setInterval(scanFrame, 180);

  } catch (error) {
    stopScanner(false);
    showResult(
      'Помилка камери: ' + error.message,
      '#f4cccc'
    );
  }
}

async function configureCamera(track) {
  const info = [];

  try {
    const caps = track.getCapabilities
      ? track.getCapabilities()
      : {};

    if (caps.focusMode &&
        caps.focusMode.includes('continuous')) {
      try {
        await track.applyConstraints({
          advanced: [{ focusMode: 'continuous' }]
        });
      } catch (e) {}
    }

    if (caps.zoom &&
        Number.isFinite(caps.zoom.min) &&
        Number.isFinite(caps.zoom.max)) {
      const zoom = Math.max(
        caps.zoom.min,
        Math.min(1, caps.zoom.max)
      );

      try {
        await track.applyConstraints({
          advanced: [{ zoom: zoom }]
        });
      } catch (e) {}
    }

    const settings = track.getSettings();

    info.push(
      'Відео: ' +
      (settings.width || video.videoWidth) +
      '×' +
      (settings.height || video.videoHeight)
    );

    info.push(
      'Zoom: ' +
      (settings.zoom === undefined
        ? 'автоматичний'
        : settings.zoom + '×')
    );

    info.push(
      'Фокус: ' +
      (settings.focusMode || 'автоматичний')
    );

  } catch (e) {
    info.push('Стандартні параметри камери');
  }

  cameraInfo.textContent = info.join(' | ');
}

function decodeCanvas() {
  const source =
    new ZXing.HTMLCanvasElementLuminanceSource(
      canvas
    );

  const bitmap = new ZXing.BinaryBitmap(
    new ZXing.HybridBinarizer(source)
  );

  try {
    const result = reader.decode(bitmap);
    return result ? cleanCode(result.getText()) : '';
  } catch (error) {
    return '';
  } finally {
    reader.reset();
  }
}

function enhanceContrast(strength) {
  const image = ctx.getImageData(
    0, 0, canvas.width, canvas.height
  );

  const data = image.data;

  // Контрастність навколо середньої яскравості.
  // Альфа-канал залишається без змін.
  let min = 255;
  let max = 0;

  for (let i = 0; i < data.length; i += 4) {
    const gray =
      0.299 * data[i] +
      0.587 * data[i + 1] +
      0.114 * data[i + 2];

    if (gray < min) min = gray;
    if (gray > max) max = gray;
  }

  const range = Math.max(1, max - min);

  for (let i = 0; i < data.length; i += 4) {
    const gray =
      0.299 * data[i] +
      0.587 * data[i + 1] +
      0.114 * data[i + 2];

    let value = ((gray - min) / range) * 255;

    value = (value - 127.5) * strength + 127.5;
    value = Math.max(0, Math.min(255, value));

    data[i] = value;
    data[i + 1] = value;
    data[i + 2] = value;
  }

  ctx.putImageData(image, 0, 0);
}

function scanFrame() {
  if (!scanning || processing || decoding ||
      !reader || video.readyState < 2) {
    return;
  }

  decoding = true;

  try {
    const width = video.videoWidth;
    const height = video.videoHeight;

    if (!width || !height) return;

    frameNumber++;

    // Три режими:
    // 0 — центр кадру
    // 1 — ширша центральна зона
    // 2 — повний кадр
    const mode = frameNumber % 3;

    let sx, sy, sw, sh;

    if (mode === 0) {
      sx = Math.floor(width * 0.05);
      sy = Math.floor(height * 0.35);
      sw = Math.floor(width * 0.90);
      sh = Math.floor(height * 0.30);
    } else if (mode === 1) {
      sx = 0;
      sy = Math.floor(height * 0.20);
      sw = width;
      sh = Math.floor(height * 0.60);
    } else {
      sx = 0;
      sy = 0;
      sw = width;
      sh = height;
    }

    canvas.width = sw;
    canvas.height = sh;

    ctx.drawImage(
      video,
      sx, sy, sw, sh,
      0, 0, sw, sh
    );

    // Спроба 1: оригінальне зображення
    let code = decodeCanvas();

    // Спроба 2: підвищення контрастності
    // Виконуємо періодично, щоб не перевантажити телефон.
    if (!code && frameNumber % 3 === 0) {
      enhanceContrast(1.5);
      code = decodeCanvas();
    }

    // Спроба 3: ще вищий контраст
    if (!code && frameNumber % 9 === 0) {
      enhanceContrast(1.4);
      code = decodeCanvas();
    }

    if (code && validCode(code)) {
      registerCandidate(code);
    }

  } catch (error) {
    console.warn('Помилка сканування:', error);
  } finally {
    decoding = false;
  }
}

function registerCandidate(code) {
  const now = Date.now();

  // Підтвердження двома однаковими результатами
  // протягом трьох секунд.
  if (candidate === code &&
      now - candidateTime < 3000) {
    candidateCount++;
  } else {
    candidate = code;
    candidateCount = 1;
  }

  candidateTime = now;

  if (candidateCount < 2) {
    showResult(
      'Зчитано: ' + code +
      '. Підтверджуємо...',
      '#fff3cd'
    );
    return;
  }

  currentCode = code;
  processing = true;
  pauseScanner();

  if (navigator.vibrate) {
    navigator.vibrate(120);
  }

  showResult(
    'Перевіряємо номер: ' + code,
    '#fff3cd'
  );

  sendRequest('check', code)
    .then(response => {
      if (!response.ok) {
        throw new Error(response.message || 'Помилка');
      }

      if (response.found) {
        return sendRequest('mark', code);
      }

      showConfirmation(
        code,
        'add',
        'Номер відсутній у таблиці. ' +
        'Перевірте його перед додаванням.'
      );

      return null;
    })
    .then(response => {
      if (!response) return;

      if (!response.ok || !response.found) {
        throw new Error(
          response.message || 'Не вдалося позначити номер'
        );
      }

      showResult(
        'Знайдено: ' + code +
        '. Позначено зеленим.',
        '#b7e1cd'
      );

      setDetails('Рядок таблиці: ' + response.row);
      finishProcessing();
    })
    .catch(error => {
      showResult(
        'Помилка зв’язку: ' + error.message,
        '#f4cccc'
      );
      showConfirmation(
        code,
        'retry',
        'Не вдалося перевірити номер. ' +
        'Повторіть запит.'
      );
    });
}

function showConfirmation(code, mode, description) {
  confirmMode = mode;
  barcodeInput.value = code;

  confirmTitle.textContent =
    mode === 'add'
      ? 'Номер не знайдено'
      : 'Повторна перевірка';

  confirmDescription.textContent = description;

  confirmButton.textContent =
    mode === 'add'
      ? 'Додати в таблицю'
      : 'Перевірити повторно';

  confirmation.style.display = 'block';
}

async function confirmBarcode() {
  const code = cleanCode(barcodeInput.value);

  if (!validCode(code)) {
    showResult(
      'Введіть коректний номер',
      '#f4cccc'
    );
    return;
  }

  confirmButton.disabled = true;

  try {
    if (confirmMode === 'add') {
      const response = await sendRequest('add', code);

      if (!response.ok) {
        throw new Error(response.message);
      }

      showResult(
        response.found
          ? 'Знайдено та позначено: ' + code
          : 'Додано новий номер: ' + code,
        response.found ? '#b7e1cd' : '#fff3cd'
      );

      setDetails('Рядок таблиці: ' + response.row);

      confirmation.style.display = 'none';
      finishProcessing();
    } else {
      const response = await sendRequest('check', code);

      if (!response.ok) {
        throw new Error(response.message);
      }

      if (response.found) {
        const marked = await sendRequest('mark', code);

        if (!marked.ok || !marked.found) {
          throw new Error(marked.message);
        }

        showResult(
          'Знайдено та позначено: ' + code,
          '#b7e1cd'
        );

        confirmation.style.display = 'none';
        finishProcessing();
      } else {
        showConfirmation(
          code,
          'add',
          'Номер відсутній. Підтвердіть додавання.'
        );
      }
    }
  } catch (error) {
    showResult(
      'Помилка: ' + error.message,
      '#f4cccc'
    );
  } finally {
    confirmButton.disabled = false;
  }
}

function cancelConfirmation() {
  confirmation.style.display = 'none';
  showResult('Операцію скасовано');
  finishProcessing();
}

function manualEntry() {
  pauseScanner();
  processing = true;
  currentCode = '';

  showConfirmation(
    '',
    'retry',
    'Введіть інвентарний номер вручну.'
  );
}

function pauseScanner() {
  if (scanTimer) {
    clearInterval(scanTimer);
    scanTimer = null;
  }

  scanning = false;

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  video.srcObject = null;
  reader = null;
  startButton.disabled = false;
}

function stopScanner(showMessage = true) {
  pauseScanner();
  processing = false;
  candidate = '';
  candidateCount = 0;
  confirmation.style.display = 'none';

  if (showMessage) {
    showResult('Сканування зупинено');
  }
}

function finishProcessing() {
  processing = false;
  candidate = '';
  candidateCount = 0;

  // Після результату камера не запускається
  // без дозволу користувача.
  startButton.disabled = false;
}

function sendRequest(action, barcode) {
  if (pendingRequest) {
    return Promise.reject(
      new Error('Попередній запит ще виконується')
    );
  }

  const requestId =
    Date.now().toString(36) + '-' +
    Math.random().toString(36).slice(2);

  const url = new URL(SCRIPT_URL);

  url.searchParams.set('action', action);
  url.searchParams.set('barcode', barcode);
  url.searchParams.set('requestId', requestId);

  return new Promise((resolve, reject) => {
    pendingRequest = {
      requestId,
      resolve,
      reject
    };

    requestTimer = setTimeout(() => {
      if (pendingRequest &&
          pendingRequest.requestId === requestId) {
        pendingRequest = null;
        requestTimer = null;
        reject(new Error('Час очікування відповіді минув'));
      }
    }, 15000);

    requestFrame.src = url.toString();
  });
}

window.addEventListener('message', event => {
  if (!pendingRequest) return;

  // Повідомлення має надходити саме з нашого iframe.
  if (event.source !== requestFrame.contentWindow) {
    return;
  }

  // Apps Script може працювати через googleusercontent.com.
  const allowedOrigin =
    /^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/i
      .test(event.origin) ||
    event.origin === 'https://script.google.com';

  if (!allowedOrigin) return;

  const data = event.data;

  if (!data || typeof data !== 'object') return;

  if (data.requestId !== pendingRequest.requestId) {
    return;
  }

  const request = pendingRequest;
  pendingRequest = null;

  clearTimeout(requestTimer);
  requestTimer = null;

  request.resolve(data);
});

window.addEventListener('pagehide', () => {
  pauseScanner();
});
</script>

</body>
</html>
