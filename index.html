
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Інвентаризація V12.2</title>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;font-family:Arial,sans-serif;text-align:center;background:#f5f6f8;color:#222}
h2{margin:8px 0}
p{color:#555}
button{border:0;border-radius:9px;padding:12px 15px;margin:4px;font-size:16px;color:white;background:#1769aa}
button:disabled{opacity:.5}
.gray{background:#666}
.red{background:#b3261e}
.camera-box{position:relative;max-width:550px;margin:12px auto;background:black;border-radius:12px;overflow:hidden}
video{display:block;width:100%;height:auto}
.scan-area{position:absolute;left:12%;top:40%;width:76%;height:20%;border:2px solid #00ff88;border-radius:8px;pointer-events:none}
.scan-line{position:absolute;left:15%;top:50%;width:70%;border-top:2px solid #00ff88;pointer-events:none}
.hint{max-width:550px;margin:10px auto;padding:10px;border-radius:9px;background:#e8f2ff;color:#17578c}
#result{max-width:550px;margin:12px auto;padding:15px;border-radius:10px;background:#e5e7eb;font-size:18px;font-weight:bold;overflow-wrap:anywhere}
#details{font-size:13px;color:#555;margin:8px auto}
.stats{display:flex;gap:8px;max-width:550px;margin:12px auto}
.stat{flex:1;padding:12px 5px;background:white;border-radius:9px;border:1px solid #ddd}
.stat strong{display:block;font-size:25px}
.manual{max-width:550px;margin:15px auto}
.manual input{width:100%;padding:12px;font-size:18px;border:1px solid #aaa;border-radius:9px}
#confirmBox{display:none;max-width:550px;margin:12px auto;padding:16px;background:#fff1cc;border:1px solid #e1bd62;border-radius:10px}
#confirmCode{font-size:24px;font-weight:bold;overflow-wrap:anywhere}
#history{max-width:550px;margin:15px auto;text-align:left}
.history-item{background:white;padding:10px;margin:5px 0;border-radius:8px;border-left:5px solid #aaa;overflow-wrap:anywhere}
.history-item.found{border-color:#188038}
.history-item.added{border-color:#c68100}
.history-item.error{border-color:#c62828}
.sound-controls{max-width:550px;margin:8px auto;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.sound-controls label{display:flex;align-items:center;gap:6px;font-size:16px}
.sound-controls input{width:19px;height:19px}
</style>
</head>

<body>
<h2>Інвентаризація V12.2</h2>
<p>Безперервне сканування Code 128 зі звуком</p>

<div class="hint">
  Тримайте штрихкод приблизно за 15 см від камери.
  Після зчитування наведіть камеру на наступний пристрій.
</div>

<div class="sound-controls">
  <label>
    <input type="checkbox" id="soundEnabled" checked>
    Звук увімкнено
  </label>
  <button class="gray" onclick="testSound()">
    🔊 Перевірити звук
  </button>
</div>

<button id="startBtn" onclick="startScanner()">
  Почати сканування
</button>
<button class="gray" onclick="stopScanner()">
  Зупинити
</button>

<div class="camera-box">
  <video id="camera" autoplay playsinline muted></video>
  <div class="scan-area"></div>
  <div class="scan-line"></div>
</div>

<div id="result">Очікування сканування...</div>
<div id="details"></div>

<div class="stats">
  <div class="stat">
    <strong id="foundCount">0</strong>
    Знайдено
  </div>
  <div class="stat">
    <strong id="addedCount">0</strong>
    Додано
  </div>
  <div class="stat">
    <strong id="totalCount">0</strong>
    Разом
  </div>
</div>

<div id="confirmBox">
  <h3>Номер не знайдено</h3>
  <div id="confirmCode"></div>
  <p>Додати цей номер у Google Таблицю?</p>
  <button class="red" onclick="confirmAdd()">Додати</button>
  <button class="gray" onclick="cancelAdd()">Скасувати</button>
</div>

<div class="manual">
  <input id="manualCode" placeholder="Ввести номер вручну">
  <button onclick="manualScan()">Перевірити номер</button>
</div>

<h3>Історія сканування</h3>
<div id="history"></div>

<script>
'use strict';

const SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbxQSpqKkPO0AinEQ-N4f7tz12K6je2aFDbyLO3MMgyjpbci8edMDq57qhos4VBJOTgE/exec';

const video = document.getElementById('camera');
const resultBox = document.getElementById('result');
const details = document.getElementById('details');

let stream = null;
let detector = null;
let reader = null;
let scanning = false;
let busy = false;
let awaitingConfirmation = false;
let token = 0;
let timer = null;
let frameCount = 0;
let startedAt = 0;

let candidate = '';
let candidateCount = 0;
let candidateTime = 0;
let lastHandled = '';
let lastSeenAt = 0;
let pendingBarcode = '';

let requestScript = null;
let requestTimer = null;
let requestResolve = null;
let requestReject = null;

let foundCount = 0;
let addedCount = 0;

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', {
  willReadFrequently: true
});

// ===== ГУЧНИЙ ЗВУК =====

let audioContext = null;

function initSound() {
  if (!document.getElementById('soundEnabled').checked) return;

  try {
    if (!audioContext) {
      const Audio = window.AudioContext ||
                    window.webkitAudioContext;

      if (!Audio) {
        throw Error('Web Audio API недоступний');
      }

      audioContext = new Audio();
    }

    if (audioContext.state === 'suspended') {
      audioContext.resume().catch(e =>
        console.warn('Audio resume', e)
      );
    }
  } catch (e) {
    details.textContent = 'Звук недоступний: ' + e.message;
  }
}

function tone(hz, duration, offset = 0) {
  if (
    !document.getElementById('soundEnabled').checked ||
    !audioContext ||
    audioContext.state !== 'running'
  ) return;

  const t = audioContext.currentTime + offset;
  const o = audioContext.createOscillator();
  const g = audioContext.createGain();

  // Різкіший, чіткіший звук
  o.type = 'square';
  o.frequency.setValueAtTime(hz, t);

  // Підвищений рівень сигналу
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.65, t + 0.008);
  g.gain.setValueAtTime(0.65, t + duration - 0.02);
  g.gain.linearRampToValueAtTime(0.0001, t + duration);

  o.connect(g);
  g.connect(audioContext.destination);

  o.start(t);
  o.stop(t + duration + 0.02);
}

function sound(type) {
  if (type === 'found') {
    tone(1100, 0.13);
  } else if (type === 'not_found') {
    tone(720, 0.12);
    tone(720, 0.12, 0.19);
  } else if (type === 'error') {
    tone(320, 0.40);
  }
}

function testSound() {
  initSound();

  if (!document.getElementById('soundEnabled').checked) {
    show('Увімкніть звук перемикачем', '#fff0c2');
    return;
  }

  if (audioContext) {
    if (audioContext.state === 'running') {
      sound('found');
    } else {
      audioContext.resume()
        .then(() => sound('found'))
        .catch(() =>
          show('Браузер не дозволив звук', '#f4cccc')
        );
    }
  }
}

document.getElementById('soundEnabled')
  .addEventListener('change', e => {
    if (e.target.checked) initSound();
  });

// ===== ІНТЕРФЕЙС =====

function show(text, color = '#e5e7eb') {
  resultBox.textContent = text;
  resultBox.style.background = color;
}

function validCode(code) {
  return typeof code === 'string' &&
    code.trim().length > 0 &&
    code.trim().length <= 150;
}

function updateStats() {
  document.getElementById('foundCount').textContent =
    foundCount;

  document.getElementById('addedCount').textContent =
    addedCount;

  document.getElementById('totalCount').textContent =
    foundCount + addedCount;
}

function addHistory(code, status, message) {
  const item = document.createElement('div');

  item.className = 'history-item ' + status;
  item.textContent =
    new Date().toLocaleTimeString('uk-UA') +
    ' | ' + code + ' | ' + message;

  const list = document.getElementById('history');
  list.prepend(item);

  while (list.children.length > 20) {
    list.lastElementChild.remove();
  }
}

// ===== GOOGLE APPS SCRIPT =====

function apiRequest(action, barcode) {
  return new Promise((resolve, reject) => {
    if (requestScript) {
      reject(new Error('Попередній запит ще триває'));
      return;
    }

    const script = document.createElement('script');
    const url = new URL(SCRIPT_URL);

    url.searchParams.set('action', action);
    url.searchParams.set('barcode', barcode);
    url.searchParams.set('callback', 'inventoryCallback');
    url.searchParams.set('_', Date.now().toString());

    requestScript = script;
    requestResolve = resolve;
    requestReject = reject;

    script.src = url.toString();
    script.async = true;

    script.onerror = () =>
      finishRequest(
        new Error('Помилка зв’язку з Google Apps Script')
      );

    requestTimer = setTimeout(() =>
      finishRequest(
        new Error('Час очікування відповіді минув')
      ), 15000);

    document.head.appendChild(script);
  });
}

function finishRequest(error, data) {
  const resolve = requestResolve;
  const reject = requestReject;

  requestResolve = null;
  requestReject = null;

  if (requestTimer) {
    clearTimeout(requestTimer);
    requestTimer = null;
  }

  if (requestScript) {
    requestScript.remove();
    requestScript = null;
  }

  if (error) {
    if (reject) reject(error);
  } else if (resolve) {
    resolve(data);
  }
}

window.inventoryCallback = data =>
  finishRequest(null, data);

// ===== КАМЕРА =====

async function setupDecoders() {
  detector = null;
  reader = null;

  if ('BarcodeDetector' in window) {
    try {
      const formats =
        await BarcodeDetector.getSupportedFormats();

      if (formats.includes('code_128')) {
        detector = new BarcodeDetector({
          formats: ['code_128']
        });
      }
    } catch (e) {}
  }

  if (window.ZXing) {
    const hints = new Map();

    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [ZXing.BarcodeFormat.CODE_128]
    );

    hints.set(
      ZXing.DecodeHintType.TRY_HARDER,
      false
    );

    reader = new ZXing.MultiFormatReader();
    reader.setHints(hints);
  }

  if (!detector && !reader) {
    throw new Error('Розпізнавач недоступний');
  }
}

async function openCamera() {
  const modes = [
    {
      facingMode: {ideal:'environment'},
      width: {ideal:1920},
      height: {ideal:1080}
    },
    {
      facingMode: {ideal:'environment'},
      width: {ideal:1280},
      height: {ideal:720}
    },
    {facingMode:{ideal:'environment'}},
    true
  ];

  let error;

  for (const mode of modes) {
    try {
      return await navigator.mediaDevices.getUserMedia({
        video: mode,
        audio: false
      });
    } catch (e) {
      error = e;

      if (
        e.name === 'NotAllowedError' ||
        e.name === 'SecurityError'
      ) throw e;
    }
  }

  throw error || new Error('Камера недоступна');
}

async function configureCamera(track) {
  try {
    const caps = track.getCapabilities
      ? track.getCapabilities()
      : {};

    if (caps.focusMode?.includes('continuous')) {
      try {
        await track.applyConstraints({
          advanced: [{focusMode:'continuous'}]
        });
      } catch (e) {}
    }

    if (
      caps.zoom &&
      Number.isFinite(caps.zoom.min) &&
      Number.isFinite(caps.zoom.max)
    ) {
      const zoom = Math.max(
        caps.zoom.min,
        Math.min(1, caps.zoom.max)
      );

      try {
        await track.applyConstraints({
          advanced: [{zoom}]
        });
      } catch (e) {}
    }
  } catch (e) {}
}

async function startScanner() {
  initSound();

  if (scanning) return;

  const current = ++token;

  scanning = true;
  busy = false;
  awaitingConfirmation = false;

  document.getElementById('startBtn').disabled = true;

  try {
    show('Запуск камери...');

    const opened = await openCamera();

    if (!scanning || current !== token) {
      opened.getTracks().forEach(t => t.stop());
      return;
    }

    stream = opened;
    video.srcObject = stream;

    await video.play();

    if (!scanning || current !== token) return;

    await configureCamera(stream.getVideoTracks()[0]);
    await setupDecoders();

    if (!scanning || current !== token) return;

    frameCount = 0;
    startedAt = performance.now();
    candidate = '';
    candidateCount = 0;
    lastHandled = '';
    lastSeenAt = 0;

    show('Наведіть штрихкод у рамку');
    details.textContent = 'Камера працює безперервно';

    schedule(current, 0);

  } catch (e) {
    stopScanner();
    show('Помилка: ' + e.message, '#f4cccc');
    sound('error');
  }
}

function schedule(current, delay = 40) {
  if (!scanning || current !== token) return;

  timer = setTimeout(() => scanFrame(current), delay);
}

function drawRegion(mode) {
  const w = video.videoWidth;
  const h = video.videoHeight;

  if (!w || !h) return false;

  const wide = mode === 'wide';

  const sx = Math.floor(w * (wide ? .02 : .05));
  const sy = Math.floor(h * (wide ? .25 : .38));
  const sw = Math.floor(w * (wide ? .96 : .90));
  const sh = Math.floor(h * (wide ? .50 : .24));

  const maxWidth = wide ? 1600 : 1280;
  const scale = Math.min(1, maxWidth / sw);

  canvas.width = Math.max(1, Math.round(sw * scale));
  canvas.height = Math.max(1, Math.round(sh * scale));

  ctx.drawImage(
    video, sx, sy, sw, sh,
    0, 0, canvas.width, canvas.height
  );

  return true;
}

function decodeZXing() {
  if (!reader) return '';

  try {
    const source =
      new ZXing.HTMLCanvasElementLuminanceSource(canvas);

    const bitmap = new ZXing.BinaryBitmap(
      new ZXing.HybridBinarizer(source)
    );

    const result = reader.decode(bitmap);

    return result
      ? String(result.getText()).trim()
      : '';

  } catch (e) {
    return '';
  } finally {
    reader.reset();
  }
}

async function scanFrame(current) {
  if (!scanning || current !== token) return;

  if (busy || awaitingConfirmation) {
    schedule(current, 100);
    return;
  }

  if (video.readyState < 2) {
    schedule(current, 100);
    return;
  }

  try {
    frameCount++;

    const elapsed = performance.now() - startedAt;
    const mode =
      elapsed > 2500 && frameCount % 3 === 0
        ? 'wide'
        : 'fast';

    if (!drawRegion(mode)) return;

    let code = '';

    if (detector) {
      try {
        const found = await detector.detect(canvas);

        if (current !== token || !scanning) return;

        const item = found.find(
          x => x.format === 'code_128'
        );

        if (item) {
          code = String(item.rawValue || '').trim();
        }
      } catch (e) {}
    }

    if (
      !code &&
      reader &&
      (!detector ||
       (elapsed > 1200 && frameCount % 3 === 0))
    ) {
      code = decodeZXing();
    }

    const now = performance.now();

    if (validCode(code)) {
      lastSeenAt = now;

      if (code === lastHandled) {
        candidate = '';
        candidateCount = 0;
        return;
      }

      if (
        code === candidate &&
        now - candidateTime < 2000
      ) {
        candidateCount++;
      } else {
        candidate = code;
        candidateCount = 1;
      }

      candidateTime = now;

      if (candidateCount >= 2) {
        candidate = '';
        candidateCount = 0;
        lastHandled = code;
        busy = true;

        processBarcode(code);
      }

    } else {
      candidate = '';
      candidateCount = 0;

      if (now - lastSeenAt > 1500) {
        lastHandled = '';
      }
    }

  } catch (e) {
    console.warn(e);
  } finally {
    if (scanning && current === token) {
      schedule(current, 40);
    }
  }
}

// ===== ОБРОБКА РЕЗУЛЬТАТІВ =====

async function processBarcode(code) {
  const started = performance.now();

  show('Перевіряємо: ' + code, '#fff3cd');

  try {
    const data = await apiRequest('scan', code);

    if (!scanning) return;

    const seconds = (
      (performance.now() - started) / 1000
    ).toFixed(1);

    if (data.status === 'found') {
      foundCount++;
      updateStats();

      show('ЗНАЙДЕНО: ' + code, '#b7e1cd');

      details.textContent =
        'Рядок ' + data.row +
        ' | Запит: ' + seconds + ' с';

      addHistory(code, 'found', 'Знайдено');

      sound('found');

      if (navigator.vibrate) {
        navigator.vibrate(80);
      }

    } else if (data.status === 'not_found') {
      awaitingConfirmation = true;
      pendingBarcode = code;

      document.getElementById('confirmCode')
        .textContent = code;

      document.getElementById('confirmBox')
        .style.display = 'block';

      show('НЕ ЗНАЙДЕНО: ' + code, '#fff0c2');

      details.textContent =
        'Потрібне підтвердження додавання';

      sound('not_found');

    } else {
      throw new Error(
        data.message || 'Невідома відповідь сервера'
      );
    }

  } catch (e) {
    show('Помилка: ' + e.message, '#f4cccc');
    addHistory(code, 'error', e.message);
    sound('error');

  } finally {
    busy = false;
  }
}

async function confirmAdd() {
  initSound();

  if (!awaitingConfirmation || busy) return;

  const code = pendingBarcode;
  busy = true;

  show('Додаємо номер: ' + code, '#fff3cd');

  try {
    const data = await apiRequest('add', code);

    if (data.status === 'added') {
      addedCount++;
      updateStats();

      show('ДОДАНО: ' + code, '#fff0c2');

      details.textContent =
        'Новий номер у рядку ' + data.row;

      addHistory(code, 'added', 'Додано');
      sound('found');

    } else if (data.status === 'found') {
      foundCount++;
      updateStats();

      show('ЗНАЙДЕНО: ' + code, '#b7e1cd');
      addHistory(code, 'found', 'Знайдено');
      sound('found');

    } else {
      throw new Error(
        data.message || 'Не вдалося додати номер'
      );
    }

    closeConfirmation();

  } catch (e) {
    show(
      'Помилка додавання: ' + e.message,
      '#f4cccc'
    );
    sound('error');

  } finally {
    busy = false;
  }
}

function closeConfirmation() {
  awaitingConfirmation = false;
  pendingBarcode = '';

  document.getElementById('confirmBox')
    .style.display = 'none';
}

function cancelAdd() {
  if (busy) return;

  const code = pendingBarcode;
  closeConfirmation();

  show('Додавання скасовано: ' + code);
  addHistory(code, 'error', 'Скасовано');
}

function manualScan() {
  initSound();

  if (busy || awaitingConfirmation) return;

  const input = document.getElementById('manualCode');
  const code = input.value.trim();

  if (!validCode(code)) {
    show('Введіть інвентарний номер', '#f4cccc');
    return;
  }

  lastHandled = code;
  busy = true;
  input.value = '';

  processBarcode(code);
}

function stopScanner() {
  scanning = false;
  token++;

  if (timer) {
    clearTimeout(timer);
    timer = null;
  }

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  video.srcObject = null;
  detector = null;
  reader = null;

  document.getElementById('startBtn')
    .disabled = false;

  if (!busy && !awaitingConfirmation) {
    show('Сканування зупинено');
  }
}

window.addEventListener('pagehide', stopScanner);

updateStats();
</script>
</body>
</html>
